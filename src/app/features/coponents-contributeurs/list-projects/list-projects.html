<div class="container">
  <button class="btn-retour">
    <i class="fas fa-arrow-left"></i> Retour
  </button>

  <h2 class="title">La liste des Projets</h2>

  <table>
    <thead>
      <tr>
        <th>N°</th>
        <th>Titre</th>
        <th>Statut</th>
        <th>Coin</th>
        <th>Débloqué</th>
        <th>Voir</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let projet of projets; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ projet.titre }}</td>
        <td>{{ projet.statut }}</td>
        <td>{{ projet.coin }}</td>
        <td>{{ projet.debloque }}</td>
        <td class="actions">
          <button><i class="fas fa-eye"></i></button>
          <button><i class="fas fa-lock-open"></i></button>
          <button><i class="fas fa-ellipsis-v"></i></button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
