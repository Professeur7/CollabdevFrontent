<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CollabDev - Inscription</title>
</head>
<body>
<div class="container">
  <div class="illustration-section">
    <div class="illustration"></div>
    <p class="slogan">Gagnez des récompenses et montez en compétences !</p>
  </div>

  <div class="form-section">
    <div class="logo"></div>
    <h1 class="title">CollabDev</h1>

    <form class="registration-form">
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-input" placeholder="Votre email">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Mot de passe</label>
        <input type="password" id="password" class="form-input" placeholder="Votre mot de passe">
      </div>

      <div class="form-group">
        <label for="confirm-password" class="form-label">Confirmer mot de passe</label>
        <input type="password" id="confirm-password" class="form-input" placeholder="Confirmez votre mot de passe">
      </div>

      <button type="submit" class="register-btn">
        <span>S'inscrire</span>
      </button>
    </form>

    <div class="login-link">
      <span>Déjà un compte ? <a href="#">Se connecter</a></span>
    </div>
  </div>
</div>
</body>
</html>
